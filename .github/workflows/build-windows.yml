name: Build JARVIS NEO Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'assistant.py'
      - 'assistant.spec'
      - 'sitecustomize.py'
      - 'jarvis_hud_runtime_hook.py'
      - 'core/**'
      - 'ui/**'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean assistant.spec

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS_NEO-Windows
          path: dist/JARVIS_NEO.exe
          if-no-files-found: error

# Rebuild after direct application-entry-point repair.
