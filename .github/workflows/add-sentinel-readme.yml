name: Document Sentinel password

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-readme:
    if: "!contains(github.event.head_commit.message, '[skip sentinel-doc]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Sentinel password to README
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          heading = '## 🔐 Mode Sentinelle'
          if heading not in text:
              marker = '\n---\n'
              section = '''\n## 🔐 Mode Sentinelle\n\nLe mot de passe du **Mode Sentinelle** est :\n\n```text\nSENTINEL-NEO-2026\n```\n\nCe code sert uniquement au verrouillage du mode Sentinelle dans NEO. Il ne doit pas être considéré comme un secret cryptographique ou une protection de compte.\n'''
              if marker in text:
                  text = text.replace(marker, marker + section + '\n', 1)
              else:
                  text = section.lstrip() + '\n' + text
              p.write_text(text, encoding='utf-8')
          else:
              print('Sentinel section already present')
      - name: Commit README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: add Sentinel mode password [skip sentinel-doc]'
          git push
