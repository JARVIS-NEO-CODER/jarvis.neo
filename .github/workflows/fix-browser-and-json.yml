name: Fix browser and internal JSON

on:
  push:
    branches: [main]
    paths:
      - 'assistant.py'
      - '.github/scripts/fix-browser-and-json.py'
      - '.github/workflows/fix-browser-and-json.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python .github/scripts/fix-browser-and-json.py
      - name: Validate Python
        run: python -m py_compile assistant.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assistant.py
          git diff --cached --quiet || git commit -m 'fix: hide internal media JSON and repair browser fallback'
          git push
      - name: Remove one-time patcher
        run: |
          rm -f .github/scripts/fix-browser-and-json.py .github/workflows/fix-browser-and-json.yml
          git add -A
          git diff --cached --quiet || git commit -m 'chore: remove one-time browser patcher'
          git push
