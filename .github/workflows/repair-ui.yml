name: Repair visible AI UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch real application entry points
        shell: python
        run: |
          from pathlib import Path
          p = Path('assistant.py')
          s = p.read_text(encoding='utf-8')

          marker = '        pages_label = QLabel("PROTOCOLES & MODULES")\n'
          insert = '''        pages_label = QLabel("PROTOCOLES & MODULES")\n        # Point d'accès explicite aux paramètres IA partagés par tout NEO.\n        self.btn_ai_settings = GlowButton("⚙ PARAMÈTRES IA", state.theme_color)\n        self.btn_ai_settings.setToolTip("Choisir le fournisseur, le modèle, la clé Groq et le fallback")\n        self.btn_ai_settings.clicked.connect(self._open_ai_settings)\n        self.left_panel.addWidget(self.btn_ai_settings)\n'''
          if marker in s and 'self.btn_ai_settings = GlowButton' not in s:
              s = s.replace(marker, insert, 1)

          method_marker = '    def _set_model_tier(self, tier):\n'
          method = '''    def _open_ai_settings(self):\n        try:\n            from ui.provider_settings import ProviderSettingsDialog\n            dialog = ProviderSettingsDialog(self)\n            dialog.exec()\n            self._update_model_tier_ui(CONFIG.get("model_tier", "moyen"))\n        except Exception as exc:\n            signals.log_msg.emit("IA", f"Impossible d'ouvrir les paramètres IA : {exc}")\n\n'''
          if method_marker in s and '    def _open_ai_settings(self):' not in s:
              s = s.replace(method_marker, method + method_marker, 1)

          main_marker = '    window = JarvisWindow()\n    window.show()\n'
          main_insert = '''    window = JarvisWindow()\n    window.show()\n\n    try:\n        from ui.discrete_hud import DiscreteHud\n        window._jarvis_discrete_hud = DiscreteHud(window)\n        window._jarvis_discrete_hud.show_discrete()\n    except Exception as exc:\n        logging.exception("Impossible d'initialiser le HUD discret : %s", exc)\n'''
          if main_marker in s and 'window._jarvis_discrete_hud = DiscreteHud(window)' not in s:
              s = s.replace(main_marker, main_insert, 1)

          old_models = '''        self._groq_models = [\n            ("Llama 3.1 8B Instant", "llama-3.1-8b-instant"),\n            ("Llama 3.3 70B Versatile", "llama-3.3-70b-versatile"),\n            ("GPT-OSS 20B", "openai/gpt-oss-20b"),\n            ("GPT-OSS 120B", "openai/gpt-oss-120b"),\n            ("Qwen 3.8 27B", "qwen/qwen3.8-27b"),\n            ("Groq Compound", "groq/compound"),\n            ("Groq Compound Mini", "groq/compound-mini"),\n        ]'''
          new_models = '''        # Single source of truth: this is the model list used by the visible UI.\n        from core.ai_model_catalog import GROQ_MODELS\n        self._groq_models = list(GROQ_MODELS)'''
          if old_models in s:
              s = s.replace(old_models, new_models, 1)
          elif 'self._groq_models = list(GROQ_MODELS)' not in s:
              raise SystemExit('Visible Groq selector block not found')

          p.write_text(s, encoding='utf-8')

      - name: Verify source patch
        run: |
          python -m py_compile assistant.py ui/provider_settings.py ui/discrete_hud.py
          python - <<'PY'
          from pathlib import Path
          s = Path('assistant.py').read_text(encoding='utf-8')
          required = [
              'self.btn_ai_settings = GlowButton',
              'def _open_ai_settings(self):',
              'window._jarvis_discrete_hud = DiscreteHud(window)',
              'self._groq_models = list(GROQ_MODELS)',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Patch incomplet: ' + ', '.join(missing))
          print('Visible AI settings, HUD and Groq model list wiring verified.')
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assistant.py
          git diff --cached --quiet || git commit -m 'fix: wire visible Groq model list to shared catalog'
          git push
