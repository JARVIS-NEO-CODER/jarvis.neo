name: JARVIS NEO Mobile Bridge Contract

on:
  push:
    branches: [main]
    paths:
      - 'jarvis_mobile_bridge.py'
      - 'jarvis_remote_transport.py'
      - 'tests/test_mobile_bridge.py'
      - '.github/workflows/test-mobile-bridge.yml'
  pull_request:
    paths:
      - 'jarvis_mobile_bridge.py'
      - 'jarvis_remote_transport.py'
      - 'tests/test_mobile_bridge.py'
      - '.github/workflows/test-mobile-bridge.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'fastapi>=0.115,<1' 'uvicorn>=0.30,<1'
      - run: python -m unittest tests/test_mobile_bridge.py -v
