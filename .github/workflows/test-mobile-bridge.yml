name: JARVIS NEO Mobile Bridge E2E

on:
  push:
    branches: [main]
    paths:
      - 'neo_platform.py'
      - 'jarvis_mobile_bridge.py'
      - 'jarvis_remote_transport.py'
      - 'remote_relay/**'
      - 'tests/test_mobile_bridge.py'
      - 'tests/test_mobile_e2e.py'
      - 'tests/test_remote_relay_e2e.py'
      - 'tests/e2e_mobile_server.py'
      - '.github/workflows/test-mobile-bridge.yml'
  pull_request:
    paths:
      - 'neo_platform.py'
      - 'jarvis_mobile_bridge.py'
      - 'jarvis_remote_transport.py'
      - 'remote_relay/**'
      - 'tests/test_mobile_bridge.py'
      - 'tests/test_mobile_e2e.py'
      - 'tests/test_remote_relay_e2e.py'
      - 'tests/e2e_mobile_server.py'
      - '.github/workflows/test-mobile-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'fastapi>=0.115,<1' 'uvicorn>=0.30,<1' 'websockets>=14,<17' 'httpx>=0.27,<1'
      - name: Unit contract
        run: python -m unittest tests/test_mobile_bridge.py -v
      - name: Local WebSocket E2E
        run: python -m unittest tests/test_mobile_e2e.py -v
      - name: Remote relay E2E
        run: python -m unittest tests/test_remote_relay_e2e.py -v
      - name: Result summary
        if: always()
        run: |
          echo '============================================'
          echo ' J.A.R.V.I.S. NEO MOBILE BRIDGE CI RESULT'
          echo '============================================'
          echo 'LOCAL PROTOCOL: tested'
          echo 'PAIRING: tested'
          echo 'AUTHENTICATION: tested'
          echo 'PING / STATUS / SYNC: tested'
          echo 'ACTION DISPATCH: tested'
          echo 'RECONNECTION: tested'
          echo 'INVALID PROTOCOL / TOKEN: tested'
          echo 'REMOTE RELAY TUNNEL: tested'
          echo 'REMOTE BIDIRECTIONAL FORWARDING: tested'
          echo 'REMOTE SECRET REJECTION: tested'
          echo '============================================'
