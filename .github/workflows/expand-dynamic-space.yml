name: Expand Dynamic Space

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply expansion
        run: python scripts/expand_dynamic_space.py
      - name: Validate Python
        run: python -m py_compile assistant.py
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/expand_dynamic_space.py .github/workflows/expand-dynamic-space.yml
          git add assistant.py scripts/expand_dynamic_space.py .github/workflows/expand-dynamic-space.yml
          git diff --cached --quiet || git commit -m "feat: show full useful content in dynamic space"
          git push
