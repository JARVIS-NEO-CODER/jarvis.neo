name: Implement Groq runtime
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'feat: integrate Groq runtime router'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('assistant.py')
          text = path.read_text(encoding='utf-8')
          if 'from core.conversation_ai import ConversationAI' not in text:
              text = text.replace('import requests\n', 'import requests\nfrom core.conversation_ai import ConversationAI\n', 1)
          if '"groq_api_key"' not in text:
              marker = '    "web_port": 8888,\n'
              additions = ('    "groq_api_key": os.getenv("GROQ_API_KEY", ""),\n'
                           '    "groq_model": "llama-3.1-8b-instant",\n'
                           '    "groq_timeout": 60,\n'
                           '    "ai_provider": "groq",\n'
                           '    "groq_fallback_to_ollama": True,\n'
                           '    "groq_quota_fallback": "ollama",\n')
              text = text.replace(marker, marker + additions, 1)
          if 'self.conversation_ai = ConversationAI(CONFIG, ollama)' not in text:
              text = text.replace('    def __init__(self):\n        self.faq = {', '    def __init__(self):\n        self.conversation_ai = ConversationAI(CONFIG, ollama)\n        self.faq = {', 1)
          new_ask = '''    def ask_ai(self, text: str) -> str:
          state.is_processing = True
          signals.status_change.emit("RÉFLEXION")
          try:
              history = memory.get_history(12)
              relevant_memories = memory.search_memory(text, 5)
              tier_label = MODEL_TIERS.get(state.current_model_tier, {}).get("label", "Personnalisé")
              provider = self.conversation_ai
              messages = [{"role": "system", "content": f"""
          Tu es J.A.R.V.I.S. NEO, l'assistant personnel informatique de ton utilisateur.
          Tu réponds toujours en français sauf demande contraire.
          Tu es calme, intelligent, professionnel et chaleureux.
          Pour une conversation simple, réponds naturellement et brièvement.
          Pour une commande, va droit au but.
          Ne prétends jamais avoir effectué une action si le programme ne l'a pas réellement effectuée.
          Utilise les informations fournies par le programme comme contexte système.

          CONFIGURATION ACTUELLE :
          Mode : {tier_label}
          Fournisseur configuré : {CONFIG.get('ai_provider', 'groq')}
          Modèle Groq : {CONFIG.get('groq_model', 'llama-3.1-8b-instant')}
          Modèle local : {get_active_model(vision=False)}
          """}]
              if relevant_memories:
                  messages.append({"role": "system", "content": "Mémoire pertinente (peut être incomplète) :\n" + "\n".join(item["content"] for item in relevant_memories)})
              messages.extend(history)
              messages.append({"role": "user", "content": text})
              response = provider.chat(messages)
              state.is_processing = False
              signals.status_change.emit("OPÉRATIONNEL")
              return response
          except Exception as e:
              state.is_processing = False
              signals.status_change.emit("ERREUR")
              return f"Erreur noyau IA : {e}"

'''
          text, count = re.sub(r'    def ask_ai\(self, text: str\) -> str:.*?(?=    def get_weather\(self\):)', new_ask, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('ask_ai block not found')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate
        run: |
          python -m py_compile assistant.py core/conversation_ai.py core/groq_provider.py core/ai_provider_router.py
          grep -q 'ConversationAI(CONFIG, ollama)' assistant.py
          grep -q 'provider.chat(messages)' assistant.py
      - name: Commit
        run: |
          git config user.name 'JARVIS-NEO-CODER'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assistant.py
          git commit -m 'feat: integrate Groq runtime router'
          git push
      - name: Remove workflow
        if: always()
        run: |
          git rm -f .github/workflows/implement-groq-runtime.yml || true
          git diff --cached --quiet || git commit -m 'chore: remove temporary Groq runtime workflow'
          git push || true
