name: Fix ConversationAI wiring

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch CommandProcessor
        shell: python
        run: |
          from pathlib import Path
          p = Path("assistant.py")
          text = p.read_text(encoding="utf-8")
          old = 'self.conversation_ai = ConversationAI(CONFIG)'
          new = 'self.conversation_ai = ConversationAI(CONFIG, ollama)'
          if old not in text:
              raise SystemExit("ConversationAI(CONFIG) not found")
          text = text.replace(old, new, 1)
          old_return = '            return response["message"]["content"]'
          new_return = '            return response'
          if old_return not in text:
              raise SystemExit("ConversationAI response return not found")
          text = text.replace(old_return, new_return, 1)
          debug = '''print("DEBUG web_search :", hasattr(CommandProcessor, "web_search"))\nprint("DEBUG open_app   :", hasattr(CommandProcessor, "open_app"))\nprint("DEBUG kill_app   :", hasattr(CommandProcessor, "kill_app"))\nprint("DEBUG MRO :", CommandProcessor.__mro__)\nprint("DEBUG DICT :", [k for k in CommandProcessor.__dict__ if "app" in k.lower() or "web" in k.lower()])\n'''
          text = text.replace(debug, "", 1)
          p.write_text(text, encoding="utf-8")

      - name: Validate
        run: python -m py_compile assistant.py core/conversation_ai.py core/ai_provider_router.py core/groq_provider.py

      - name: Commit repair and remove workflow
        shell: bash
        run: |
          git config user.name "JARVIS NEO Bot"
          git config user.email "jarvis-neo-bot@users.noreply.github.com"
          rm -f .github/workflows/fix-conversation-ai.yml
          git add assistant.py .github/workflows/fix-conversation-ai.yml
          git commit -m "fix: wire CommandProcessor to ConversationAI" || exit 0
          git push
