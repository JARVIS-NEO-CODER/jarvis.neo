name: Apply clean web result cards

on:
  push:
    paths:
      - '.github/scripts/fix-pretty-web-results.py'
      - '.github/workflows/fix-pretty-web-results.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch assistant
        run: python .github/scripts/fix-pretty-web-results.py
      - name: Commit patch and clean temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assistant.py
          git diff --cached --quiet && { echo 'No changes'; exit 0; }
          git commit -m 'fix: render web search results as clean cards'
          git push
          rm -f .github/scripts/fix-pretty-web-results.py .github/workflows/fix-pretty-web-results.yml
          git add -A
          git commit -m 'chore: remove one-time web result patcher'
          git push
