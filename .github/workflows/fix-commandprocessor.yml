name: Fix CommandProcessor indentation

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair CommandProcessor.ask_ai
        shell: python
        run: |
          from pathlib import Path

          p = Path("assistant.py")
          lines = p.read_text(encoding="utf-8").splitlines(keepends=True)

          start = next(
              (i for i, line in enumerate(lines)
               if line.startswith("    def ask_ai(self, text: str) -> str:")),
              None,
          )
          end = (
              next(
                  (i for i, line in enumerate(lines[start + 1:], start + 1)
                   if line.startswith("    def get_weather(self):")),
                  None,
              )
              if start is not None else None
          )

          if start is None or end is None:
              raise SystemExit("CommandProcessor.ask_ai boundaries not found")

          for i in range(start + 1, end):
              if lines[i].strip():
                  lines[i] = "    " + lines[i]
              else:
                  lines[i] = "    \n"

          p.write_text("".join(lines), encoding="utf-8")
          print(f"Repaired CommandProcessor.ask_ai lines {start + 1}-{end}")

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "JARVIS NEO Bot"
          git config user.email "jarvis-neo-bot@users.noreply.github.com"
          rm -f .github/workflows/fix-commandprocessor.yml
          git add assistant.py .github/workflows/fix-commandprocessor.yml
          if git diff --cached --quiet; then
            echo "No repair needed"
          else
            git commit -m "fix: restore CommandProcessor structure"
            git push
          fi
