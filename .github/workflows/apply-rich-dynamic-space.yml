name: Apply rich Dynamic Space

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/upgrade_dynamic_space_rich.py'
      - '.github/workflows/apply-rich-dynamic-space.yml'
      - 'assistant.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply rich renderer
        run: python3 .github/scripts/upgrade_dynamic_space_rich.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- assistant.py; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assistant.py
          git commit -m 'feat: make dynamic space rich-media aware'
          git push
