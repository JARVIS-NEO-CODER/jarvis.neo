name: Recover assistant.py
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good assistant.py
        run: |
          git checkout 1e6c7d3608d9c92f4757869da544959d1de35a80 -- assistant.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assistant.py
          git diff --cached --quiet && exit 0
          git commit -m "recovery: restore assistant.py from known-good commit"
          git push
