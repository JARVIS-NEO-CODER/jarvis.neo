name: Hide internal media JSON
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/strip-media-json.py'
      - '.github/workflows/strip-media-json.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python .github/scripts/strip-media-json.py
      - run: python -m py_compile assistant.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assistant.py
          git diff --cached --quiet || git commit -m 'fix: hide internal media JSON from chat'
          git push
      - name: Remove patcher
        run: |
          rm -f .github/scripts/strip-media-json.py .github/workflows/strip-media-json.yml
          git add -A
          git diff --cached --quiet || git commit -m 'chore: remove media JSON patcher'
          git push
