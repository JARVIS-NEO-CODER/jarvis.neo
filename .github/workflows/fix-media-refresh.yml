name: Fix media refresh
on:
  push:
    paths:
      - '.github/scripts/fix-media-refresh.py'
      - '.github/workflows/fix-media-refresh.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python .github/scripts/fix-media-refresh.py
      - run: python -m py_compile assistant.py core/web_media.py
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assistant.py
          git commit -m 'fix: keep media results visible in dynamic space'
          git push
          rm -f .github/scripts/fix-media-refresh.py .github/workflows/fix-media-refresh.yml
          git add -A
          git commit -m 'chore: remove one-time media refresh patcher'
          git push
