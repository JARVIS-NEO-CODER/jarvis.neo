name: apply-web-tts-fix
on:
  push:
    paths:
      - '.github/scripts/fix_web_and_tts.py'
      - '.github/workflows/apply-web-tts-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch
        run: python .github/scripts/fix_web_and_tts.py
      - name: Validate
        run: python -m py_compile assistant.py core/web_search.py
      - name: Commit final files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/scripts/fix_web_and_tts.py .github/workflows/apply-web-tts-fix.yml
          git add assistant.py
          git commit -m 'fix: repair web search and TTS playback' || exit 0
          git push
