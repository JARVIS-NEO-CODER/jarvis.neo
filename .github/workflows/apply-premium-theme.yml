name: Apply premium NEO theme

on:
  push:
    branches: [main]
    paths:
      - 'assistant.py'
      - 'core/neo_theme.py'
      - '.github/scripts/apply-premium-theme.py'
      - '.github/workflows/apply-premium-theme.yml'

permissions:
  contents: write

jobs:
  theme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply premium theme directly to source
        run: |
          python .github/scripts/apply-premium-theme.py
          python -m py_compile assistant.py
      - name: Verify theme hook
        run: |
          grep -F "from core.neo_theme import apply_theme" assistant.py
          grep -F "apply_theme(QApplication.instance())" assistant.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add assistant.py
          if git diff --cached --quiet; then
            echo 'Theme hook already present.'
          else
            git commit -m 'feat: apply premium NEO interface theme to source'
            git push
          fi
