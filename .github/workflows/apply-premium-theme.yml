name: Apply premium NEO theme

on:
  push:
    branches: [main]
    paths:
      - 'assistant.py'
      - 'core/neo_theme.py'
      - '.github/scripts/apply-premium-theme.py'
      - '.github/workflows/apply-premium-theme.yml'

permissions:
  contents: write

jobs:
  theme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply theme
        run: python .github/scripts/apply-premium-theme.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assistant.py
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'feat: apply premium NEO interface theme'
            git push
          fi
