name: Apply premium NEO theme and voice optimizations

on:
  push:
    branches: [main]
    paths:
      - 'assistant.py'
      - 'core/assistant_components.py'
      - 'core/neo_theme.py'
      - '.github/scripts/apply-premium-theme.py'
      - '.github/workflows/apply-premium-theme.yml'

permissions:
  contents: write

jobs:
  patch-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply runtime optimizations
        run: |
          python .github/scripts/apply-premium-theme.py
          python -m py_compile assistant.py core/assistant_components.py
      - name: Verify source changes
        run: |
          grep -F "from core.neo_theme import apply_theme" assistant.py
          grep -F "apply_theme(QApplication.instance(), window)" assistant.py
          grep -F "speech.say(response, priority=True)" assistant.py
          grep -F "calibrated = False" assistant.py
          grep -F "def say(self, text, priority=False)" core/assistant_components.py
          grep -F "self._lock = threading.Lock()" core/assistant_components.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add assistant.py core/assistant_components.py
          if git diff --cached --quiet; then
            echo 'Runtime optimizations already present.'
          else
            git commit -m 'feat: reduce voice response latency and apply NEO theme'
            git push
          fi
