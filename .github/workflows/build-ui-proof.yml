name: JARVIS NEO UI proof build

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: github.event.head_commit.message != 'ci: remove UI proof build workflow'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Compile source
        run: |
          python -m py_compile assistant.py ui/provider_settings.py ui/discrete_hud.py
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean assistant.spec
      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS_NEO-Windows-UI-proof
          path: dist/JARVIS_NEO.exe
          if-no-files-found: error
